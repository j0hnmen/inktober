<style>
/* Layout: one screen. A spiral sketchbook lies under a lamp; pull the top sheet away from the spiral to tear it out. */
:root{
  --wall:#121211; --ink:#d9d5cc; --dim:#8a857b; --line:#2c2a26;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink)}
html{overflow:hidden;overscroll-behavior:none}   /* the page never scrolls: a refresh cannot restore an old offset */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}   /* nothing on the page can be selected (no blue selection on a long press) */
img{-webkit-user-drag:none}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}   /* nothing to select or long-press: it is a notebook, not a page of text */
body{font-family:var(--mono);font-size:11px;overflow:hidden;-webkit-font-smoothing:antialiased}
.room{height:100%;display:grid;grid-template-rows:auto auto;align-content:center;justify-items:center;gap:var(--lgap,22px);position:relative;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 58px);   /* the bottom strip is for the track and the reset button */
  background:radial-gradient(ellipse 55% 60% at 50% 45%, rgba(255,246,226,.08), transparent 70%)}
.stage{grid-row:2;width:100%;display:grid;place-items:start center;position:relative;z-index:1}
.room.flying .stage{z-index:6;pointer-events:none} .room.flying .book{pointer-events:auto}
.room.holding .stage{z-index:6}
.room.glinting .stage{z-index:7;pointer-events:none}
/* The wall behind the notebook: 31 slots, always 8 + 8 + 8 + 7 (the last row centred), scaled as one block to fit the screen.
   A torn sheet dissolves into its day's slot at 35% once it has fallen. */
.wallgrid{position:absolute;inset:0;z-index:0;pointer-events:none;transition:opacity 1.2s ease}
/* phones: the wall stops at the screen's edges (not under Safari's see-through bars) and fades out at the top and the bottom */
@media (max-width:600px){ .wallgrid{overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent env(safe-area-inset-top,0px),#000 calc(env(safe-area-inset-top,0px) + 70px),#000 calc(100% - env(safe-area-inset-bottom,0px) - 90px),transparent calc(100% - env(safe-area-inset-bottom,0px)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,transparent env(safe-area-inset-top,0px),#000 calc(env(safe-area-inset-top,0px) + 70px),#000 calc(100% - env(safe-area-inset-bottom,0px) - 90px),transparent calc(100% - env(safe-area-inset-bottom,0px)),transparent 100%)} }
.slot{position:absolute;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.slot img,.page img,.viewer img{-webkit-touch-callout:none}   /* no "save / share" menu on a long press */
/* a drawing settles onto the wall: it fades in while easing down to its size */
.slot img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(1.035);transition:opacity 1.2s ease, transform 1.6s cubic-bezier(.2,.7,.2,1), filter 1.2s ease;-webkit-user-drag:none}
.slot img.on{opacity:1;filter:brightness(.18);transform:none}
.slot img.on.fresh{filter:none}   /* a drawing lands on the wall at full strength, then settles back to its dim place */   /* dimmed by darkening, not by transparency: the paper grain of the background never shows through a drawing */
.room.neg:not(.walldone) .slot img.on{opacity:.18;filter:none}   /* Mystical's negative (light background): the waiting drawings go back to faint, not dark */
.room.neg:not(.walldone) .slot img.negsrc.on{opacity:.18;filter:invert(1) grayscale(1)}
/* gallery (once the whole notebook has gone): the drawings in full, each one a sheet you can pick up */
.room.walldone .wallgrid{pointer-events:auto;z-index:3}
.room.walldone .stage{pointer-events:none}
/* the finale: the drawings come up to full strength one after the other, left to right, top to bottom */
.room.walldone .slot img.on{opacity:1;filter:none}
.room.walldone .slot{cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.25,1);transform-origin:50% 55%;perspective:700px}
.room.walldone .slot img{transition:opacity 1.2s ease var(--d,0ms), filter 1.2s ease var(--d,0ms)}
/* phones: the gallery scrolls, and a zoom slider sets how many drawings sit side by side */
@media (max-width:600px){
  .room.walldone .wallgrid{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}   /* the pinch is ours: it sets the drawings' size */
  .room.walldone .zoom{display:flex}
  .room.walldone .wfade{display:block}
}
/* the finale: the logo gives way, the drawings take the whole page and glide to their places */
/* the last sheet leaves: the notebook's logo and name slide up out of the screen (no fade) */
.room .head{transition:translate .6s cubic-bezier(.55,0,.8,.2)}
.room.headout .head{translate:0 calc(-100% - 90px);pointer-events:none}
.room.walldone .head{opacity:0;transition:opacity 0s linear .7s, translate .6s cubic-bezier(.55,0,.8,.2);pointer-events:none}
/* the gallery's top and bottom: the logo and the signature, faded in with the wall */
.wlogo,.wsig{position:absolute;left:50%;z-index:4;width:auto;transform:translateX(-50%);pointer-events:none;-webkit-user-drag:none;user-select:none;opacity:0;transition:opacity .5s ease}
/* the gallery's logo comes down from above, the name up from below: a slide, no fade */
.wlogo{translate:0 calc(-100% - 80px)} .wsig{translate:0 calc(100% + 90px)}
.room.walldone .wlogo{opacity:.82;translate:0 0;filter:invert(0) grayscale(0);transition:translate .8s cubic-bezier(.2,.8,.25,1) .15s, filter 1s cubic-bezier(.7,0,.84,0)}
.room.walldone .wsig{opacity:.92;translate:0 0;transition:translate .8s cubic-bezier(.2,.8,.25,1) .3s, filter 1s cubic-bezier(.7,0,.84,0);filter:invert(0) drop-shadow(0 0 .45px rgba(236,232,222,.9)) drop-shadow(0 0 .45px rgba(236,232,222,.6)) drop-shadow(0 2px 6px rgba(0,0,0,.9)) drop-shadow(0 0 16px rgba(0,0,0,.75))}
.room.walldone.neg .wlogo{filter:invert(1) grayscale(1)} .room.walldone.neg .wsig{filter:invert(1) drop-shadow(0 0 .45px rgba(19,23,33,.9)) drop-shadow(0 0 .45px rgba(19,23,33,.6)) drop-shadow(0 2px 6px rgba(236,236,234,.9)) drop-shadow(0 0 16px rgba(236,236,234,.75))}
@media (max-width:600px){ .room.walldone .wlogo,.room.walldone .wsig{z-index:6} }
/* a computer window too small for the whole wall: it scrolls like the phone gallery, under the fixed logo and signature */
.room.walldone.wscroll .wallgrid{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.room.walldone.wscroll .wfade{display:block}
.room.walldone.wscroll .wlogo,.room.walldone.wscroll .wsig{z-index:6}

@media (max-width:600px){.room.walldone .slot{transition:left .6s cubic-bezier(.2,.7,.2,1), top .6s cubic-bezier(.2,.7,.2,1), width .6s cubic-bezier(.2,.7,.2,1), height .6s cubic-bezier(.2,.7,.2,1)}}
/* phone gallery: the drawings fade out under the logo and under the bottom strip as they scroll */
.wfade{display:none;position:absolute;left:0;right:0;z-index:3;pointer-events:none}
.wfade.t{top:0;height:calc(var(--wt,10px) + 34px);background:linear-gradient(var(--wall) 0%, rgba(18,18,17,.92) 40%, rgba(18,18,17,.55) 70%, rgba(18,18,17,0) 100%)}
.wfade.b{bottom:0;height:calc(var(--wb,64px) + 34px);background:linear-gradient(0deg, var(--wall) 0%, rgba(18,18,17,.92) 40%, rgba(18,18,17,.55) 70%, rgba(18,18,17,0) 100%)}   /* the same soft fade as at the top, under the fixed signature */
.zoom{position:absolute;left:max(12px, env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;display:none;align-items:center;gap:10px;
  color:var(--dim);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:0;animation:zin .8s ease .9s forwards}
@keyframes zin{to{opacity:1}}
.zoom input{-webkit-appearance:none;appearance:none;width:110px;height:2px;margin:0;background:var(--line);outline:none;border-radius:1px}
.zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:1px solid #3a3833;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.zoom input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:1px solid #3a3833}
.zoom svg{width:14px;height:14px;flex:none}
@media (hover:hover) and (pointer:fine){   /* phones: no hover on the wall (a tap left a sheet stuck enlarged) */
.room.wallive .slot:hover{transform:translateY(-6px) scale(1.3);z-index:5}
.room.wallive .slot:hover{filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
}
/* the hovered sheet becomes soft paper: hinged strips that ripple */
.slot .wv{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.slot .wv .wh{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.slot .wv .wh.r{left:50%} .slot .wv .wh.l{right:50%}
.slot .wv .ws{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d}
.slot .wv .wh.r .ws{transform-origin:0 50%} .slot .wv .wh.l .ws{transform-origin:100% 50%}
.slot .wv .wh.r .ws .ws{left:100%} .slot .wv .wh.l .ws .ws{left:auto;right:100%}
.slot .wv .wi{position:absolute;top:0;bottom:0;left:-1px;right:-1px;background-repeat:no-repeat;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.slot.waving img{visibility:hidden}
@keyframes sway{0%,100%{transform:rotateX(3deg) rotateY(-4deg) rotateZ(-.4deg)}50%{transform:rotateX(-2deg) rotateY(4deg) rotateZ(.5deg)}}
.slot.lifted{visibility:hidden}
/* gallery hover: the drawing's label, as under the notebook, appears just below the lifted sheet */
.wlabel{position:absolute;left:0;top:0;z-index:6;pointer-events:none;display:flex;align-items:center;white-space:nowrap;background:#fff;color:#000;
  font:700 var(--fs,14px)/1 "Courier Prime","Courier New",monospace;letter-spacing:-.02em;padding:.45em .6em;box-shadow:0 3px 8px rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,6px);transition:opacity .3s ease, transform .45s cubic-bezier(.2,.8,.25,1)}
.wlabel.on{opacity:1;transform:translate(-50%,0)}
.room.neg .wlabel{filter:invert(1) grayscale(1)}
@media (prefers-reduced-motion: reduce){.room.walldone .slot:hover img{animation:none}}
/* the sheet viewer: recto / verso card, bending paper, gloss on the deep blacks */
.viewer{position:fixed;inset:0;z-index:2000;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
.viewer.open{display:block}
.viewer .vbg{position:absolute;inset:0;background:rgba(12,12,11,.86);opacity:0;transition:opacity .45s ease}
.viewer.show .vbg{opacity:1}
.viewer .vstage{position:absolute;inset:0;perspective:1500px;transform:translateY(var(--voff,0px))}
.viewer .vzip{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.viewer .vcard{position:absolute;left:50%;top:50%;margin-left:calc(var(--cw) / -2);margin-top:calc(var(--ch) / -2);width:var(--cw);height:var(--ch);transform-style:preserve-3d;cursor:grab;visibility:hidden}
.viewer .vcard.dragging{cursor:grabbing}
.viewer .vcard:focus{outline:none}
.viewer .vsh{position:absolute;left:50%;top:50%;width:var(--cw);height:calc(var(--ch) * .9);transform:translate(-50%,-44%) rotate(var(--rz,0deg)) scaleX(var(--shx,1));border-radius:10%;background:rgba(0,0,0,.55);filter:blur(28px);opacity:0;pointer-events:none;transition:opacity .4s}
.viewer.show.ready .vsh{opacity:var(--sho,.8)}
.viewer.hero .vsh{transition:opacity .45s ease .45s}
.vcard .half{position:absolute;top:0;height:100%;width:var(--sw);transform-style:preserve-3d}
.vcard .half.r{left:50%} .vcard .half.l{right:50%}
.vcard .strip{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d}
.vcard .strip .strip{left:100%;transform-origin:0 50%}
.vcard .half.l .strip .strip{left:auto;right:100%;transform-origin:100% 50%}
.vcard .half.r > .strip{transform-origin:0 50%} .vcard .half.l > .strip{transform-origin:100% 50%}
.vcard .f,.vcard .b{position:absolute;top:0;bottom:0;left:-2px;right:-2px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-repeat:no-repeat;background-size:var(--cw) var(--ch)}
.vcard .f{background-image:var(--rf);background-position:calc(2px - var(--x0)) 0}
.vcard .b{background-image:var(--rb);background-position:calc(2px - var(--x1)) 0;transform:rotateY(180deg)}
.vcard .g{position:absolute;inset:0;pointer-events:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:var(--cw) var(--ch);mask-size:var(--cw) var(--ch);
  background:linear-gradient(105deg, transparent 35%, rgba(225,229,238,.16) 41%, rgba(240,243,250,.62) 47%, rgba(255,255,255,.9) 50%, rgba(240,243,250,.62) 53%, rgba(225,229,238,.16) 59%, transparent 65%);
  background-repeat:no-repeat;background-size:calc(var(--cw) * 3) calc(var(--ch) * 3);opacity:var(--go,0)}
.vcard .f .g{-webkit-mask-image:var(--rg);mask-image:var(--rg);-webkit-mask-position:calc(2px - var(--x0)) 0;mask-position:calc(2px - var(--x0)) 0;background-position:calc(var(--gx) - var(--x0) + 2px) var(--gy)}
.vcard .b .g{display:none}
.viewer .vglow{display:none}
/* the making of: a photo that swaps places with the drawing, one going back while the other comes forward (like the
   PS1 Tomb Raider menu). The photo is smaller: in front, the drawing shows round it; behind, the drawing hides it. */
.viewer .vmk{position:absolute;left:50%;top:50%;width:var(--pw,200px);height:var(--ph,350px);margin-left:calc(var(--pw,200px) / -2);margin-top:calc(var(--ph,350px) / -2);
  pointer-events:none;opacity:0;z-index:1;border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.4);will-change:transform}
.viewer .vmk i{position:absolute;inset:0;background-size:cover;background-position:50% 50%;opacity:0;transition:opacity .6s ease}
.viewer .vmk i.on{opacity:1}
.viewer .vmk video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease;display:block}
.viewer .vmk video.on{opacity:1}
.viewer .vcard{z-index:2}
.viewer.mkfront .vmk{z-index:3}
.viewer .vpeek{all:unset;position:absolute;right:0;z-index:4;width:172px;height:230px;cursor:pointer;background-size:cover;background-position:50% 50%;border-radius:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateX(172px) rotate(-6deg);transform-origin:0 0;opacity:0;pointer-events:none;
  transition:transform .6s cubic-bezier(.2,.8,.25,1), opacity .4s ease;-webkit-tap-highlight-color:transparent}
.viewer .vpeek.on{transform:translateX(84px) rotate(-6deg);opacity:1;pointer-events:auto}
.viewer .vpeek i{position:absolute;right:calc(100% - 42px);top:calc(100% + 10px);transform:rotate(6deg);transform-origin:100% 0;text-align:right;white-space:nowrap;font:400 12px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;color:#b9b3a7;opacity:0;transition:opacity .25s ease;pointer-events:none}
@media (hover:hover){ .viewer .vpeek.on:hover i{opacity:1} }   /* its caption, small, right-aligned under the corner */
@media (hover:hover){ .viewer .vpeek.on:hover{transform:translateX(66px) rotate(-4deg)} }   /* beta testers: the sketch further out from the edge */
.viewer .vpeek::after{content:"";position:absolute;inset:-22px 0 -22px -30px}   /* a hit box wider than the sketch: easier to reach */
@media (max-width:600px){ .viewer .vpeek{width:110px;height:147px;transform:translateX(110px) rotate(-6deg)} .viewer .vpeek.on{transform:translateX(56px) rotate(-6deg)} }
@media (max-width:600px) and (hover:hover){ .viewer .vpeek.on:hover{transform:translateX(44px) rotate(-4deg)} }
/* holding a drawing that has a reference: the gallery's glint crosses it, slow at first */
.viewer .vshine{position:absolute;left:50%;top:50%;z-index:2;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.12) 45.5%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.12) 54.5%,transparent 60%) no-repeat;background-size:300% 300%;background-position:120% -20%;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.viewer .vcap{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;opacity:0;white-space:nowrap;color:#e8e4dc;font-family:"Courier Prime","Courier New",monospace;line-height:1.35}
.viewer .vcap b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em} .viewer .vcap span{display:block;font-size:15px;color:#b9b3a7}
@media (max-width:600px){ .viewer .vcap b{font-size:16px} .viewer .vcap span{font-size:13px} }
.viewer .vhint3{display:none}
.viewer.hasmk:not(.hero) .vhint:not(.vhint2):not(.vhint3){display:none}

/* gallery: the sheets that have a making of shimmer now and then */
.slot.hasmk,.slot.hasmo{--mki:linear-gradient(transparent,transparent)}
.slot.hasmk::after,.slot.hasmo::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.1) 44%,rgba(255,255,255,.42) 50%,rgba(255,255,255,.1) 56%,transparent 62%) no-repeat;background-size:300% 100%;background-position:120% 0;
  -webkit-mask-image:var(--mki);mask-image:var(--mki);-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:screen}
/* a making of: now and then a glint of light crosses the drawing (0.85 s, with a little bounce) */
.slot .mopk{position:absolute;right:6%;top:6%;width:46%;height:46%;z-index:-1;border-radius:2px;background-size:cover;background-position:50% 50%;box-shadow:0 4px 12px rgba(0,0,0,.45);
  transform:translate(0,0) rotate(0deg);transform-origin:0 100%;transition:transform .45s cubic-bezier(.2,.8,.25,1);pointer-events:none}   /* fully behind the sheet; it slides out, never fades */

.room.wallive .slot.hasmo.pop,.room.wallive .slot.hasmo:hover{z-index:4}   /* its corner goes over the neighbours, never under them */
.room.wallive .slot.hasmo{transition:transform .55s cubic-bezier(.2,.8,.25,1), z-index 0s linear .5s} .room.wallive .slot.hasmo.pop,.room.wallive .slot.hasmo:hover{transition:transform .55s cubic-bezier(.2,.8,.25,1), z-index 0s}
.room.walldone:not(.wallive) .slot{pointer-events:none}   /* nothing reacts until the wall is fully up */
.room:not(.wallive) .slot .mopk{display:none}   /* no corner until the wall is fully up (the last drawing fades in over the finale) */
.room.walldone .slot.hasmo:not(:hover)::after{display:none}   /* a making-of drawing glints only on hover (if it also has a reference) */
.slot.shine::after{animation:mkshine 1.25s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes mkshine{0%{opacity:1;background-position:120% 0}85%{opacity:1}100%{opacity:0;background-position:-20% 0}}
.room:not(.walldone) .slot.hasmk::after,.room:not(.walldone) .slot.hasmo::after{display:none}
.viewer .fan{position:absolute;perspective:1500px;z-index:2;opacity:0;pointer-events:none;transition:opacity .45s ease .45s}

  background:radial-gradient(ellipse closest-side,rgba(10,10,9,.62) 0%,rgba(10,10,9,.42) 40%,rgba(10,10,9,.15) 72%,rgba(10,10,9,0) 100%);transition:opacity .5s ease}   /* a very soft shadow under the logo and the name: they stay readable over the drawings on the wall */
.room.neg .head::before{opacity:0}
.head::after{content:"";position:absolute;left:50%;top:50%;width:calc(100% + 120px);height:calc(100% + 40px);transform:translate(-50%,-50%);z-index:-1;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse closest-side,rgba(10,10,9,.6) 0%,rgba(10,10,9,.5) 45%,rgba(10,10,9,.2) 78%,rgba(10,10,9,0) 100%);transition:opacity .6s ease}
.room.galpeek:not(.neg) .head::after{opacity:1}
@media (max-width:600px){ .head::before,.head::after{display:none} }   /* phones: no shade under the logo and the name */   /* the wall at full strength behind: a wider, deeper, still very diffuse shade keeps them readable */
.room:not(.neg) .head .logo,.room:not(.neg) .head .sig{filter:drop-shadow(0 0 6px rgba(8,8,7,.75)) drop-shadow(0 0 16px rgba(8,8,7,.45))}   /* the letters themselves get a soft dark halo */
/* his signature from the back of the current sheet, under the logo */
.sig{position:relative;height:clamp(42px,6.6vh,62px);}
@media (min-height:760px) and (min-width:1200px){ .sig{height:clamp(58px,7.4vh,92px)} .logo{height:clamp(36px,5vh,56px) !important} }   /* big screens (full screen): the logo and the name grow with the room
 */ .sig{aspect-ratio:1.1;pointer-events:none}
.head.bigname .sig{aspect-ratio:1.04}   /* the opening: his name, large under the logo */
.sig img{position:absolute;left:50%;top:0;height:100%;width:auto;transform:translateX(-50%);opacity:0;transition:opacity .7s ease;-webkit-user-drag:none}
.sig img.on{opacity:.92}
/* a hairline outline in the same tone: thicker, more present strokes, same handwriting */
.sig img{filter:drop-shadow(0 0 .45px rgba(236,232,222,.9)) drop-shadow(0 0 .45px rgba(236,232,222,.6))}
.room.neg .sig img{filter:invert(1) drop-shadow(0 0 .45px rgba(19,23,33,.9))}
.logo{position:relative;display:block;height:clamp(24px,4.3vh,38px);width:auto;opacity:.82;user-select:none;-webkit-user-drag:none}
/* links: Spotify and Deezer top left, Instagram and LinkedIn bottom right (they come with the notebook, like the gallery button) */
.soc{position:absolute;z-index:7;display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.25,1), filter .5s ease}
.soc.tl{transform:translateX(-48px)} .soc.tr{transform:translateX(48px)}   /* they slide in from their side */
.room.galon .soc{opacity:1;pointer-events:auto;transform:none}
.soc.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px, env(safe-area-inset-left,0px));align-items:center}
.soc.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px, env(safe-area-inset-right,0px))}
.soc a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#9a958b;-webkit-tap-highlight-color:transparent}

@media (max-width:600px){ .soc.tl{left:max(14px, env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 14px)} .soc.tr{right:max(14px, env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px)} .soc{gap:0} .soc a{width:44px;height:44px;margin:-3px} .soc svg{width:21px;height:21px} }
@media (min-width:601px){ .soc{gap:4px} .soc.tl{top:30px;left:66px} .soc.tr{top:30px;right:66px} .soc a{width:56px;height:56px;margin:-3px} .soc svg{width:29px;height:29px} }
.soc a{transition:color .2s ease, transform .25s cubic-bezier(.2,1.4,.3,1)} .soc a:hover{color:var(--ink);transform:scale(1.12)} .soc a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.room.neg .soc{filter:invert(1) grayscale(1)}
.soc a{position:relative}
.soc svg{transition:opacity .25s ease}
.soc svg.c{position:absolute;inset:0;margin:auto;opacity:0;pointer-events:none}
.soc a.wave svg{transition:opacity .6s ease} .soc a.wave svg.c{opacity:1} .soc a.wave svg:not(.c){opacity:0}
.soc a:hover svg.c,.soc a:focus-visible svg.c{opacity:1} .soc a:hover svg:not(.c),.soc a:focus-visible svg:not(.c){opacity:0}
.reset{all:unset;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:max(16px, env(safe-area-inset-right,0px));z-index:5;
  cursor:pointer;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:10px;padding:8px 10px;border:1px solid var(--line)}
.reset:hover{color:var(--ink);border-color:var(--dim)}
.room.walldone .reset.gal{display:none}
/* the gallery button: a small notebook that comes apart into a grid on hover (a grid straight away on a phone) */
.reset.gal{border:0;padding:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#b9b3a7;background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 6px 16px rgba(0,0,0,.25)}   /* the same plain round button as the mute one */
@media (hover:hover){ .reset.gal:hover{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.25)} }   /* phones: no hover look on a tap */
.reset.gal:focus-visible{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.25)}
.reset.gal svg{width:26px;height:26px;display:block;overflow:visible}
.reset.gal svg g,.reset.gal svg rect,.reset.gal svg path{transform-box:fill-box;transform-origin:center}
.reset.gal{overflow:visible}
.reset.gal::after{content:"";position:absolute;inset:-14px;border-radius:50%}   /* a hit box wider than the button */
.reset.gal > svg:not(.tl){display:none}
.reset.gal svg.tl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;clip-path:circle(50% at 50% 50%)}   /* the tiles stay inside the disc */
/* at rest: only the fast-forward arrows. Hover: the sheets appear all round, from the middle out, and the arrows run to the right (in place) */
.reset.gal .tl rect{opacity:0;transform:scale(.55);transition:opacity .22s ease var(--d,0s), transform .45s cubic-bezier(.2,1.2,.3,1) var(--d,0s)}
@media (hover:hover){ .reset.gal:hover .tl rect{opacity:1;transform:none} } .reset.gal:focus-visible .tl rect{opacity:1;transform:none}
@keyframes ffgo{0%{transform:translateX(-3px);opacity:0}30%{opacity:1}70%{opacity:1}100%{transform:translateX(3px);opacity:0}}
@media (hover:hover) and (min-width:601px){ .reset.gal:hover .tl .ff,.reset.gal:focus-visible .tl .ff{animation:ffgo .85s linear infinite} .reset.gal:hover .tl .ff.b,.reset.gal:focus-visible .tl .ff.b{animation-delay:.14s} }
@media (max-width:600px){ .reset.gal{width:40px;height:40px;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px)} }   /* phones: the hover look, still */
/* gone as soon as it is pressed */
@media (hover:none){ .reset.gal:hover,.reset.gal:focus,.reset.gal:active{color:#b9b3a7;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 6px 16px rgba(0,0,0,.25);transform:none} .reset.gal{-webkit-tap-highlight-color:transparent} }   /* phones: no hover look */
html.neg .viewer .vcap b{color:#151515} html.neg .viewer .vcap span{color:#4a4741}   /* Mystical's negative: the caption reads dark on the light background */
.viewer .vcap b,.viewer .vcap span{transition:color .55s ease}
.room.galgo .reset.gal{opacity:0 !important;pointer-events:none !important;transition:opacity .3s ease}
/* hovering it: the drawings already on the wall behind come up to full strength */
.room.galpeek:not(.walldone) .slot img.on{filter:none;transition:opacity .6s ease, filter .6s ease}
@media (min-width:601px){ .reset.gal{right:80px;bottom:39px} }   /* computer: more room round the edges */
.room .book{transition:transform .9s cubic-bezier(.3,.7,.2,1), filter .5s ease} .room.galpeek:not(.neg) .book{filter:brightness(.65)}   /* the notebook steps back a little while the wall comes up */
.reset.gal{opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.25,1), box-shadow .25s ease, color .2s ease}   /* from the right */   /* not on the way in (logo and sound buttons): it comes with the notebook */
.room.galon.galbtn .reset.gal{opacity:1;pointer-events:auto;transform:none}   /* only once the first sheet (Apple) has been torn out */
.reset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* phones: the reset button moves to the bottom corner so the track title has the top */
@media (max-width:600px){.reset{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:max(10px, env(safe-area-inset-right,0px));padding:6px 8px;font-size:9px}}

/* ———— sound button: one big round glowing button with a speaker; tap it for the music ———— */
.snd{all:unset;position:absolute;left:50%;bottom:var(--sb,10px);z-index:7;width:var(--ss,64px);height:var(--ss,64px);margin-left:calc(var(--ss,64px) / -2);border-radius:50%;
  cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  transform:translateY(calc(100% + var(--sb,10px) + 90px));visibility:hidden;opacity:0}
.snd.on{visibility:visible;opacity:1;transform:none;transition:transform 1s cubic-bezier(.2,1.3,.3,1),opacity .4s ease}
.snd.out{transform:translateY(calc(100% + var(--sb,10px) + 90px)) !important;opacity:0;transition:transform .5s cubic-bezier(.5,0,.75,0),opacity .4s ease .15s}
/* the halo breathes; the disc is lit from within */
.snd-h{position:absolute;inset:-45%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,240,212,.5) 0%,rgba(255,236,200,.2) 32%,rgba(255,232,190,.06) 52%,rgba(255,232,190,0) 70%);
  animation:sndbr 3.2s ease-in-out infinite}
@keyframes sndbr{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.snd-r{position:absolute;inset:0;border-radius:50%;pointer-events:none;border:1.5px solid rgba(255,244,222,.75);opacity:0}
.snd-d{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#1d1c1a;
  background:radial-gradient(circle at 38% 30%,#fffdf7 0%,#f6f0e3 42%,#e2d9c6 78%,#cbc1ac 100%);
  box-shadow:inset 0 -3px 6px rgba(120,100,70,.25),inset 0 2px 2px rgba(255,255,255,.9),0 0 0 1px rgba(255,248,232,.35),
    0 0 18px 3px rgba(255,238,206,.55),0 0 46px 10px rgba(255,234,196,.22),0 10px 24px rgba(0,0,0,.55);
  transition:transform .25s cubic-bezier(.2,1.4,.3,1),box-shadow .3s ease}
.snd-d svg{width:42%;height:42%}
.snd-d .w1,.snd-d .w2{opacity:.35;transition:opacity .3s ease}
.snd:hover .snd-d{transform:scale(1.05)}
.snd:hover .snd-d .w1,.snd:hover .snd-d .w2{opacity:.8}
.snd:active .snd-d{transform:scale(.93)}
.snd:focus-visible .snd-d{outline:2px solid var(--ink);outline-offset:4px}
/* turned on: a flash of light, the waves come on, then it goes */
.snd.lit .snd-d{transform:scale(1);box-shadow:inset 0 -3px 6px rgba(120,100,70,.2),inset 0 2px 2px #fff,0 0 0 1px rgba(255,250,238,.6),0 0 30px 8px rgba(255,242,214,.85),0 0 90px 26px rgba(255,236,200,.4),0 10px 24px rgba(0,0,0,.4)}
.snd.lit .snd-d .w1,.snd.lit .snd-d .w2{opacity:1}
.snd.lit .snd-h{animation:none;opacity:1;transform:scale(1.35);transition:transform .5s ease,opacity .5s ease}
/* ———— the way in: under the intro logo, sound on (lit) or sound off (dark); either one starts the notebook ———— */
.gate{position:fixed;left:50%;top:60%;z-index:9;display:flex;flex-direction:row-reverse;gap:var(--gg,24px);transform:translateX(-50%);visibility:hidden;pointer-events:none;opacity:0;transition:opacity .6s ease}
.gate.on{visibility:visible;pointer-events:auto;opacity:1}

@keyframes gglow{0%{transform:scale(1);opacity:.6;animation-timing-function:cubic-bezier(.4,0,.4,1)}18%{transform:scale(1.18);opacity:.85;animation-timing-function:cubic-bezier(.4,0,.6,1)}52%,100%{transform:scale(1);opacity:.6}}
/* the wave: every 2.8 s two faint rings of light leave the button and spread out, one just after the other */
.gate .g-on .gw{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;
  box-shadow:0 0 0 1.2px rgba(255,242,214,.5),0 0 16px 3px rgba(255,236,200,.2)}

@keyframes gwave{0%{transform:scale(1);opacity:0}6%{opacity:.3}62%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}
/* the opening: eight drawings around the logo, floating a little; they come in from outside once the logo is up, draw a
   few px closer (and hold still) while the pointer is on a sound button, and leave the screen when one is chosen */
.fl8{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.fl8 .fs{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:780/1035;
  transition:transform 1.15s cubic-bezier(.2,.8,.25,1);will-change:transform}
.fl8 .fs.out{transition:transform .75s cubic-bezier(.5,0,.9,.4)}
.fl8 .fs.near{transition:transform .55s cubic-bezier(.2,.8,.25,1)}
.fl8 .fs.creep{transition:transform 2.7s cubic-bezier(.2,.8,.25,1)}   /* the promo: the same arrival, longer and further in, still moving when they escape */
.fl8 .fsi{width:100%;height:100%;animation:fsfloat var(--d,8s) ease-in-out infinite;animation-delay:var(--p,0s);will-change:transform}
.fl8.hold .fsi{animation-play-state:paused}
.fl8 img{display:block;width:100%;height:100%;-webkit-user-drag:none}
@keyframes fsfloat{0%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(6px,-8px) rotate(.9deg)}62%{transform:translate(-6px,6px) rotate(-.8deg)}100%{transform:translate(0,0) rotate(0deg)}}   /* a little more drift */

.fl8 .fs{pointer-events:auto;touch-action:none} .fl8 .fs.out{pointer-events:none}

.fl8 .ftag b{display:block;background:#fff;color:#000;font:700 var(--fz,20px)/normal "Courier Prime","Courier New",monospace;letter-spacing:-.02em;white-space:nowrap;padding:.317em .611em;box-shadow:0 0 0 .5px #8c8c8c}   /* the notebook's labels, floating */   /* pulled, a sheet turns in depth (up to ~15°) and springs back */
.gate .gb{all:unset;position:relative;width:var(--gs,64px);height:var(--gs,64px);border-radius:50%;display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(var(--gy,18px));

.gate .g-on{color:#1d1c1a;background:radial-gradient(circle at 38% 30%,#fffdf7 0%,#f6f0e3 42%,#e2d9c6 78%,#cbc1ac 100%);
  box-shadow:inset 0 -3px 6px rgba(120,100,70,.25),inset 0 2px 2px rgba(255,255,255,.9),0 0 0 1px rgba(255,248,232,.35),0 0 18px 3px rgba(255,238,206,.5),0 0 46px 10px rgba(255,234,196,.2),0 10px 24px rgba(0,0,0,.55)}
.gate .g-on::before{content:"";position:absolute;inset:-45%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,240,212,.42) 0%,rgba(255,236,200,.16) 32%,rgba(255,232,190,.05) 52%,rgba(255,232,190,0) 70%);animation:sndbr 3.2s ease-in-out infinite}

.gate .g-on{z-index:1}   /* plain: no outline, a faint disc, a hint of shadow */
/* the sound-on button: a little dimmer at rest, brighter when the pointer is on it */

.gate .g-on::before{filter:opacity(.6)}   /* white disc, a quieter halo */

  display:grid;place-items:center;border-radius:50%;color:#9a958b;cursor:pointer;opacity:0;visibility:hidden;transform:scale(.6);

/* cursor (mouse only): Nabil's hand-drawn hands, one picture (pages/cur.webp, nine 64 px cells at 2x), following the pointer */

  box-shadow:0 0 0 1.2px rgba(34,32,28,.42),0 0 0 2.4px rgba(255,255,255,.35),0 0 10px 2px rgba(255,255,255,.18)}   /* a ring of graphite with a light edge: it reads on the paper and on the dark */

@keyframes cwave{0%{transform:scale(1);opacity:0}8%{opacity:.55}65%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}   /* the swirl sends out a wave, like the sound button */

{ const sp=document.createElement("div"); sp.style.cssText="position:absolute;left:0;top:0;width:1px;height:var(--wh,0px);pointer-events:none"; wallgrid.appendChild(sp); }

const wlogo=document.getElementById("wlogo"), wsig=document.getElementById("wsig");

  const pad=(a.offsetHeight-sv.getBoundingClientRect().height)/2; so.style.top=Math.max(4,Math.round(b.t-pad))+"px"; }); }
function logoBox(){   /* the notebook logo's place in the room, from the layout itself (offsets ignore the way-in animation's transforms) */
  const lg=document.querySelector(".logo"); if(!lg||!lg.offsetHeight) return logoBox.v;

function placeWall(){
  const W=wallgrid.clientWidth, H=wallgrid.clientHeight;
  /* computer: 8 + 8 + 8 + 7. Phone (portrait): 4 columns, 7 full rows and a centred last row of 3, filling the screen */
  const done=true;   /* the wall is laid out as it will be at the end from the first torn sheet on: the drawings land in their final places and never move */
  /* one gap everywhere, horizontal = vertical, as a share of a drawing's width; the spare room goes to the margins, never into the gaps */
  const phone=W<600, G=0.08, m=phone?14:Math.round(Math.max(18,Math.min(W,H)*0.035));
  /* only the days that have a drawing take room, so the drawings fill the page (8 to a row on a computer; 31 by the end of the month) */
  const FILL=31;   /* the full month (31) on the gallery page */
  const count= done ? FILL : Math.max(...DAYS.map(d=>parseInt(d,10)));
  /* phone: between the logo and the bottom strip (track, reset button) */
  /* the wall takes the whole window from the first sheet on, a small margin all round (phones keep room at the bottom for the zoom slider and the reset button) */
  /* the gallery: the Inktober logo at the top, the signature (Apple's) at the bottom, the wall between them */
  /* the gallery's logo sits exactly where the notebook's logo is, at the same size: it does not move or change when the wall comes */
  const lb=logoBox(), lgH= lb ? lb.h : (phone?30:Math.round(Math.max(26,Math.min(40,H*0.045)))), lgT= lb ? lb.t : m, sgH= phone?40:(W>=1200&&H>=760 ? Math.round(Math.max(56,Math.min(90,H*0.075))) : Math.round(Math.max(36,Math.min(58,H*0.065))));   /* big screens: the name larger, like the logo */
  wlogo.style.height=lgH+"px"; wlogo.style.top=lgT+"px"; wsig.style.height=sgH+"px"; wsig.style.bottom=(phone?50:Math.round(m*0.6))+"px";   /* phones: above the zoom slider */
  const mx= phone ? m : 76;   /* computer: the drawings line up with the icons' outer edges */
  const top= done ? Math.max(lgT+lgH+(phone?26:Math.round(m*0.6)), phone?0:96) : m, bot= phone ? 52 : (done ? Math.round(m*0.6)+sgH+Math.round(m*0.5) : m);
  const top2=top, bot2=bot;   /* the wall keeps its size */
  const aw=W-2*mx, ah=H-top2-bot2;
  /* the number of columns that gives the biggest drawings for this window (thin, even gaps) */
  let C=4;
  if(phone&&done) C=zoomCols;   /* phone gallery: 4 to a row by default (2 zoomed in), filling the width; the wall scrolls */
  /* computer: the column count that gives the biggest drawings for this window, among balanced layouts (the last row at least ~40% full, never 1 or 2 drawings alone) */
  const okC=c=>{ const rem=count%c; return !rem || (rem>=3 && rem>=c*0.38); };
  let deskScroll=false;
  if(!(phone&&done)){ let best=0; for(let c=3;c<=16;c++){ if(!okC(c)) continue;
      const r=Math.ceil(count/c), ww=Math.min(aw/(c+(c-1)*G), ah/(r/CELL+(r-1)*G)); if(ww>=best*0.995){ best=Math.max(best,ww); C=c; } }   /* same size: the wider grid (fills the width better) */

    const MINW=Math.min(100,aw/3.5);
    if(best<MINW){ deskScroll=true; C=3; for(let c=16;c>=3;c--){ if(okC(c) && aw/(c+(c-1)*G)>=MINW){ C=c; break; } } } }
  const rows=Math.ceil(count/C), lastN=count-(rows-1)*C;
  /* phone gallery (and a too-small computer window): the drawings fill the width and the wall scrolls; otherwise everything fits the screen */
  const scroll=(phone&&done)||deskScroll; room.classList.toggle("wscroll",deskScroll);
  let w= scroll ? aw/(C+(C-1)*G) : Math.min(aw/(C+(C-1)*G), ah/(rows/CELL+(rows-1)*G)), h=w/CELL, g=w*G;

  /* computer, the whole wall on screen: the logo and the name as large as the room above and below the drawings allows,
     each centred in its band */
  if(!scroll && !phone){ const sT=y0, sB=H-(y0+totH);
    const lh=Math.round(Math.max(Math.min(lgH,sT*0.66), Math.min(56, sT*0.48))), sh=Math.round(Math.max(Math.min(sgH,sB*0.7), Math.min(78, sB*0.5)));   /* balanced, never filling the band */
    wlogo.style.height=lh+"px"; wlogo.style.top=Math.round(Math.max(8,(sT-lh)/2))+"px";
    wsig.style.height=sh+"px"; wsig.style.bottom=Math.round(Math.max(6,(sB-sh)/2))+"px"; }
  let endH=y0+totH+bot;
  if(scroll) endH=y0+totH+18+sgH+bot;   /* room at the end of the scroll so the last row clears the fixed signature */
  room.style.setProperty("--wb",(phone?50+sgH+6:bot)+"px");
  wallgrid.style.setProperty("--wh",scroll?endH+"px":"0px"); room.style.setProperty("--wt",top+"px"); if(!scroll) wallgrid.scrollTop=0;
  slots.forEach((s,i)=>{
    const r=Math.floor(i/C), c=i%C, off= r===rows-1 ? (C-lastN)*(w+gx)/2 : 0;
    s.style.left=(x0+off+c*(w+gx))+"px"; s.style.top=(y0+r*(h+gy))+"px";

/* phone gallery zoom: 4, 3 or 2 drawings side by side */

/* Spiral, modelled on the real sketchbook: thick black twin wire. Each ring leaves its hole, runs left over the sheet,

function wires(){

      d +=`<path pathLength="100" d="M ${hx} ${cy} A ${rx} ${ry} 0 0 0 ${hx-2*rx} ${cy}" />`;
      dl+=`<path d="M ${hx-2*rx} ${cy} A ${rx} ${ry} 0 0 0 ${ex.toFixed(1)} ${endY.toFixed(1)}" />`;
      /* highlight only along the upper arc, where the lamp catches the wire */
      hi+=`<path pathLength="100" d="M ${hx-3} ${cy-ry*0.55} A ${rx} ${ry} 0 0 0 ${cxE-rx*0.75} ${cy-ry*0.66}" />`;
    }
